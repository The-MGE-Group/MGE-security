# Fails a pull request that changes the verification layer (the files that judge changes)
# unless a maintainer added the label "verification-change".
# The list of protected files is read from the BASE branch, so a PR can't unprotect itself.
name: verification-integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  protected-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check protected files
        env:
          BASE_REF: ${{ github.base_ref }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'verification-change') }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, subprocess, sys
          base = "origin/" + os.environ["BASE_REF"]
          try:
              cfg = json.loads(subprocess.check_output(["git", "show", f"{base}:.claude/verification/config.json"]))
              patterns = cfg["protected_paths"]
          except Exception:
              print("No config on the base branch yet; nothing is protected.")
              sys.exit(0)
          changed = subprocess.check_output(["git", "diff", "--name-only", f"{base}...HEAD"], text=True).split()
          hits = [f for f in changed if any(fnmatch.fnmatch(f, p) for p in patterns)]
          if not hits:
              print("No protected files changed.")
              sys.exit(0)
          print("Protected verification files changed:\n  " + "\n  ".join(hits))
          if os.environ["HAS_LABEL"] == "true":
              print("Label 'verification-change' is present, so a maintainer approved this.")
              sys.exit(0)
          print("::error::This PR edits the checks that judge it. A maintainer must review it and add the 'verification-change' label.")
          sys.exit(1)
          PY
