# Copy to .github/dependabot.yml in a project.
# Opens pull requests that update old packages (npm and pnpm both use "npm" here) and GitHub actions.
# Waits 14 days after a release before proposing it. Security fixes are not delayed:
# turn on "Dependabot security updates" in the project's settings for those.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
