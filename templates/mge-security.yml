# Copy to .github/workflows/mge-security.yml in a project: the pull-request scan.
name: MGE Security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  security:
    uses: The-MGE-Group/MGE-security/.github/workflows/pr-scan.yml@main
    # Optional: lets Claude read each pull request and add notes. Without the secret that check is skipped.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
