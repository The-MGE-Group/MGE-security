# Copy to .github/workflows/mge-security.yml in a project: the pull-request scan.
name: MGE Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # Mondays: catches new advisories even without a pull request
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  security:
    uses: The-MGE-Group/MGE-security/.github/workflows/pr-scan.yml@main
